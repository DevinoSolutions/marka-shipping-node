name: Release

# One release pipeline per package, picked by the tag prefix:
#   canada-post-vX.Y.Z  -> publishes @joinmarka/canada-post (packages/canada-post)
#   shipping-vX.Y.Z     -> publishes @joinmarka/shipping    (packages/shipping)
# Publish @joinmarka/canada-post first when @joinmarka/shipping needs its new version.
#
# Authentication: npm trusted publishing (OIDC). Configure each package on npmjs.com under
# Settings -> Trusted Publisher -> GitHub Actions (repository DevinoSolutions/marka-shipping-node,
# workflow release.yml). If the repository secret NPM_TOKEN is set, it is used instead.
on:
  push:
    tags:
      - "canada-post-v*"
      - "shipping-v*"

permissions:
  id-token: write # OIDC token for npm trusted publishing and provenance
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Gate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use a trusted-publishing capable npm
        run: |
          set -o pipefail
          npm install -g npm@latest
          npm --version
      - name: Resolve the package from the tag
        id: pkg
        run: |
          set -o pipefail
          case "${GITHUB_REF_NAME}" in
            canada-post-v*) DIR=packages/canada-post; PREFIX=canada-post-v ;;
            shipping-v*) DIR=packages/shipping; PREFIX=shipping-v ;;
            *) echo "Unknown release tag ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          NAME="$(node -p "require('./${DIR}/package.json').name")"
          VERSION="$(node -p "require('./${DIR}/package.json').version")"
          if [ "${PREFIX}${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match ${DIR}/package.json version ${VERSION}"
            exit 1
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Install
        run: |
          set -o pipefail
          npm ci
      - name: Lint
        run: |
          set -o pipefail
          npm run lint
      - name: Format check
        run: |
          set -o pipefail
          npm run format:check
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck
      - name: Test
        run: |
          set -o pipefail
          npm test
        env:
          CANADAPOST_LIVE_TESTS: "false"
      - name: Build
        run: |
          set -o pipefail
          npm run build
      - name: Verify exports
        run: |
          set -o pipefail
          npm run verify:exports
      - name: Secret scan
        run: |
          set -o pipefail
          npm run check:secrets
      - name: Live-suite read-only guard
        run: |
          set -o pipefail
          npm run check:live-readonly
      - name: Dead code
        run: |
          set -o pipefail
          npm run check:deadcode
      - name: API docs
        run: |
          set -o pipefail
          npm run docs:api
      - name: npm pack (dry run)
        run: |
          set -o pipefail
          npm pack --dry-run -w "${{ steps.pkg.outputs.name }}"
      - name: Skip versions that are already on npm
        id: published
        run: |
          set -o pipefail
          SPEC="${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}"
          if npm view "${SPEC}" version >/dev/null 2>&1; then
            echo "${SPEC} is already on npm; nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with a token (only if NPM_TOKEN is set)
        if: ${{ env.NPM_TOKEN != '' && steps.published.outputs.exists != 'true' }}
        run: |
          set -o pipefail
          npm publish --provenance --access public -w "${{ steps.pkg.outputs.name }}"
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Publish with npm trusted publishing (OIDC)
        if: ${{ env.NPM_TOKEN == '' && steps.published.outputs.exists != 'true' }}
        run: |
          set -o pipefail
          # No token configured: npm exchanges the GitHub OIDC identity for a short-lived publish credential.
          npm publish --provenance --access public -w "${{ steps.pkg.outputs.name }}"
